<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCOM Reader</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>OCOM Reader</h1>
  <div class="header-controls">
    <label for="repo-select">Repository</label>
    <select id="repo-select"></select>
    <button id="dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">&#9788;</button>
  </div>
</header>

<main>
  <section id="ask-panel">
    <form id="ask-form">
      <input id="query-input" type="text" placeholder="Ask a question, e.g. how does retrieval ranking work" autocomplete="off">
      <button type="submit" data-mode="ask">Ask</button>
      <button type="button" data-mode="search">Search</button>
      <button type="button" data-mode="explain">Explain</button>
    </form>
    <div id="status-line" role="status"></div>
  </section>

  <section id="results">
    <div class="panel" id="answer-panel">
      <h2>Answer</h2>
      <p id="answer-text">Ask a question to see an answer here.</p>
    </div>

    <div class="panel" id="evidence-panel">
      <h2>Evidence</h2>
      <ul id="evidence-list"></ul>
    </div>

    <div class="panel" id="related-panel">
      <h2>Related Documents</h2>
      <ul id="related-list"></ul>
    </div>

    <div class="panel" id="reading-order-panel">
      <h2>Recommended Reading Order</h2>
      <ol id="reading-order-list"></ol>
    </div>
  </section>

  <aside id="sidebar">
    <div class="panel" id="workspace-panel">
      <h2>Workspace</h2>
      <ul id="workspace-list"></ul>
    </div>

    <div class="panel" id="plugin-panel">
      <h2>Plugins</h2>
      <ul id="plugin-list"></ul>
    </div>
  </aside>
</main>

<footer>
  <span id="reader-version"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
